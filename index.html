<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Disiplin Sekolah - Batas 07.40</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    
    <!-- CDN Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        /* Animasi halus untuk interaksi */
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <!-- Header dengan Jam Digital -->
        <header class="flex flex-col md:flex-row md:items-center justify-between mb-8 bg-indigo-900 p-8 rounded-[2rem] shadow-xl text-white gap-6">
            <div class="flex items-center gap-4">
                <div class="bg-white p-2 rounded-2xl overflow-hidden flex items-center justify-center w-20 h-20 shadow-lg">
                    <!-- Menampilkan logo.png - Pastikan file ada di root folder GitHub Anda -->
                    <img src="logo.png" alt="Logo Sekolah" class="max-w-full max-h-full object-contain" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\'fas fa-school text-3xl text-indigo-900\'></i>';">
                </div>
                <div>
                    <h1 class="text-3xl font-extrabold tracking-tight">Monitoring Kehadiran</h1>
                    <p class="text-indigo-200">Batas Masuk: <span class="font-bold text-white">07:40 WIB</span></p>
                </div>
            </div>
            
            <div class="flex flex-col items-end gap-2">
                <div id="digitalClock" class="text-4xl font-black tracking-widest text-yellow-400 font-mono bg-black/20 px-6 py-2 rounded-2xl border border-white/10">
                    00:00:00
                </div>
                <div class="flex gap-2">
                    <button onclick="downloadExcel()" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 shadow-md hover:shadow-green-200 active:scale-95">
                        <i class="fas fa-file-excel"></i> Export Excel
                    </button>
                    <button onclick="resetAttendance()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl text-xs font-bold transition-all border border-white/10 active:scale-95">
                        Reset Data
                    </button>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Panel Kontrol -->
            <div class="lg:col-span-4 space-y-6">
                <!-- Dropdown Pilih Nama -->
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                    <label class="block text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest">Pencatatan Kehadiran:</label>
                    <div class="relative">
                        <select id="studentSelect" onchange="processAttendance(this.value)" class="w-full p-4 rounded-2xl border-2 border-indigo-100 bg-slate-50 font-bold text-indigo-900 outline-none focus:border-indigo-500 transition-all appearance-none cursor-pointer">
                            <option value="" disabled selected>-- Pilih Nama Murid --</option>
                        </select>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-indigo-300">
                            <i class="fas fa-chevron-down"></i>
                        </div>
                    </div>
                    <p class="mt-4 text-[11px] text-slate-500 leading-relaxed italic">
                        *Sistem otomatis mendeteksi keterlambatan jika pelaporan dilakukan lewat dari pukul 07:40.
                    </p>
                </div>

                <!-- Status Alat -->
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                    <h3 class="text-xs font-bold text-indigo-900 mb-4 uppercase tracking-widest flex items-center gap-2">
                        <i class="fas fa-sync-alt"></i> Rotasi Alat Kebersihan
                    </h3>
                    <div id="toolStatusGrid" class="space-y-2"></div>
                </div>

                <!-- Audio Control (Opsional) -->
                <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200">
                    <audio id="localAudio" class="w-full h-8 mb-2">
                        <source src="suara.mp3" type="audio/mpeg">
                    </audio>
                    <p class="text-[9px] text-center text-slate-400 uppercase font-bold tracking-widest">Audio System (suara.mp3)</p>
                </div>
            </div>

            <!-- Tabel Monitoring -->
            <div class="lg:col-span-8">
                <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden min-h-[500px]">
                    <div class="p-6 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                        <h2 class="text-xl font-bold text-indigo-900 flex items-center gap-2">
                            <i class="fas fa-list-ul text-indigo-300"></i> Log Kehadiran Hari Ini
                        </h2>
                        <span id="dateDisplay" class="text-xs font-bold text-slate-400 uppercase tracking-widest"></span>
                    </div>
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 text-[10px] uppercase tracking-wider font-bold">
                                    <th class="p-4 border-b">Nama Murid</th>
                                    <th class="p-4 border-b">Jam Lapor</th>
                                    <th class="p-4 border-b text-center">Status</th>
                                    <th class="p-4 border-b text-right">Tugas Hukuman</th>
                                </tr>
                            </thead>
                            <tbody id="attendanceBody" class="divide-y divide-slate-100 text-sm">
                                <!-- Data akan masuk di sini -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Konfigurasi Batas Waktu
        const LIMIT_HOUR = 7;
        const LIMIT_MINUTE = 40;
        
        const LOCATIONS = ["Ruangan TU", "Ruang Guru", "Aula Serba Guna", "Teras Depan Kelas"];
        const STUDENTS = [
            "Andika", "Dafa Nofa Erlangga", "Fahri Maulana", "Faujiah Sulaesih", 
            "Kenzie Raditya Osas", "Siti Amelia", "Tesa Lonika Saufani", "Theresia Yunita Jadi", 
            "Fita Bunga", "Rivky Jesen P", "Alvin Putra Pratama", "Arya Dimas Pratama", 
            "Cornelius Rowen N", "Devi Afriyanti", "Elti Julianti Anthoneta B", "Fitria Sari Gozali", 
            "Leni Nur'aini", "Muhammad Raihan", "Parasha Hapizah Asipa", "Raihan Ardiansyah", 
            "Nia", "Intan"
        ].sort(); // Urutkan nama sesuai abjad

        let attendanceLogs = [];
        let locationTools = { 
            "Ruangan TU": false, 
            "Ruang Guru": false, 
            "Aula Serba Guna": false, 
            "Teras Depan Kelas": false 
        };

        // Simpan data ke LocalStorage agar tidak hilang saat refresh halaman di GitHub
        function saveData() {
            localStorage.setItem('attendance_logs', JSON.stringify(attendanceLogs));
            localStorage.setItem('location_tools', JSON.stringify(locationTools));
        }

        function loadData() {
            const savedLogs = localStorage.getItem('attendance_logs');
            const savedTools = localStorage.getItem('location_tools');
            if (savedLogs) attendanceLogs = JSON.parse(savedLogs);
            if (savedTools) locationTools = JSON.parse(savedTools);
        }

        // --- CLOCK & DATE ---
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('digitalClock').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        // --- LOGIKA SUARA AI (Web Speech API) ---
        function speakText(text) {
            // Membatalkan suara yang sedang berjalan jika ada
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID'; 
            utterance.rate = 0.9; // Sedikit lebih lambat agar jelas
            utterance.pitch = 1;
            window.speechSynthesis.speak(utterance);
        }

        function initDropdown() {
            const select = document.getElementById('studentSelect');
            STUDENTS.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                select.appendChild(opt);
            });
        }

        function updateToolStatusUI() {
            const grid = document.getElementById('toolStatusGrid');
            grid.innerHTML = LOCATIONS.map(loc => `
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center transition-all hover:bg-white hover:shadow-sm">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-tight">${loc}</span>
                    <span class="text-xs font-black ${locationTools[loc] ? 'text-blue-600' : 'text-amber-600'}">
                        ${locationTools[loc] ? 'PEL' : 'SAPU'}
                    </span>
                </div>
            `).join('');
        }

        function processAttendance(name) {
            if (!name) return;

            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false });

            if (attendanceLogs.some(log => log.name === name)) {
                alert(`${name} sudah tercatat hadir.`);
                document.getElementById('studentSelect').value = "";
                return;
            }

            let status = "Tepat Waktu";
            let punishment = "-";
            
            if (currentHour > LIMIT_HOUR || (currentHour === LIMIT_HOUR && currentMinute > LIMIT_MINUTE)) {
                status = "Terlambat";
                const loc = LOCATIONS[Math.floor(Math.random() * LOCATIONS.length)];
                const tool = locationTools[loc] ? "Mengepel" : "Menyapu";
                punishment = `${tool} di ${loc}`;
                
                // Toggle status alat untuk rotasi berikutnya
                locationTools[loc] = !locationTools[loc];
                
                // Play local sound if exists
                const audio = document.getElementById('localAudio');
                if (audio) { audio.currentTime = 0; audio.play().catch(e => {}); }
                
                speakText(`Murid bernama ${name} terlambat. Batas masuk adalah jam 07:40. Tugas hukuman anda adalah ${punishment}. Segera kerjakan.`);
            } else {
                speakText(`Murid bernama ${name} hadir tepat waktu. Selamat belajar.`);
            }

            attendanceLogs.unshift({
                name,
                time: timeString,
                status,
                punishment
            });

            saveData();
            renderLogs();
            updateToolStatusUI();
            document.getElementById('studentSelect').value = "";
        }

        function renderLogs() {
            const body = document.getElementById('attendanceBody');
            if (attendanceLogs.length === 0) {
                body.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-slate-400 italic font-medium">Belum ada aktivitas hari ini.</td></tr>`;
                return;
            }

            body.innerHTML = attendanceLogs.map(log => `
                <tr class="hover:bg-indigo-50/30 transition-all ${log.status === 'Terlambat' ? 'bg-red-50/30' : ''}">
                    <td class="p-4 font-bold text-slate-700">${log.name}</td>
                    <td class="p-4 font-mono text-slate-500 font-medium">${log.time}</td>
                    <td class="p-4 text-center">
                        <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider shadow-sm
                            ${log.status === 'Tepat Waktu' ? 'bg-green-100 text-green-700 border border-green-200' : 'bg-red-100 text-red-700 border border-red-200'}">
                            ${log.status}
                        </span>
                    </td>
                    <td class="p-4 text-right">
                        <div class="text-xs font-extrabold ${log.punishment !== '-' ? 'text-indigo-600' : 'text-slate-300'}">
                            <i class="fas ${log.punishment !== '-' ? 'fa-broom' : 'fa-minus'} mr-1"></i> ${log.punishment}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function downloadExcel() {
            const date = new Date().toLocaleDateString('id-ID').replace(/\//g, '-');
            const worksheetData = [
                ["LAPORAN ABSENSI HARIAN (Batas 07:40)"],
                ["Tanggal:", new Date().toLocaleDateString('id-ID')],
                [],
                ["No", "Nama Murid", "Jam Masuk", "Status", "Hukuman"]
            ];

            STUDENTS.forEach((name, i) => {
                const log = attendanceLogs.find(l => l.name === name);
                if (log) {
                    worksheetData.push([i + 1, log.name, log.time, log.status, log.punishment]);
                } else {
                    worksheetData.push([i + 1, name, "-", "Alpa/Belum Lapor", "-"]);
                }
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(worksheetData);
            XLSX.utils.book_append_sheet(wb, ws, "Absensi");
            XLSX.writeFile(wb, `Laporan_Absen_${date}.xlsx`);
        }

        function resetAttendance() {
            if (confirm("Hapus semua data kehadiran hari ini? (Ini juga akan menghapus data di penyimpanan lokal browser)")) {
                attendanceLogs = [];
                localStorage.removeItem('attendance_logs');
                renderLogs();
            }
        }

        // Initialize App
        window.onload = () => {
            loadData();
            initDropdown();
            updateToolStatusUI();
            renderLogs();
            updateClock();
        };
    </script>
</body>
</html>
